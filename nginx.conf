# Шаблон: заменить app.example.com / api.example.com, путь /var/www/app и порт API (PORT в apps/server/.env).
# Сертификаты: certbot certonly --nginx -d app.example.com -d api.example.com

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name app.example.com api.example.com;
        return 301 https://$host$request_uri;
    }

    ## Фронт — статика apps/frontend/dist
    server {
        listen 443 ssl;
        server_name app.example.com;
        ssl_certificate /etc/letsencrypt/live/app.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # Реальные ассеты — без SPA-фолбэка на index.html, иначе битые/старые
        # пути отдают text/html вместо text/css|js (MIME error у клиента).
        location /assets/ {
            root /var/www/app/apps/frontend/dist;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            root /var/www/app/apps/frontend/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    ## API — NestJS (глобальный префикс /api уже в приложении)
    server {
        listen 443 ssl;
        server_name api.example.com;
        ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            # Должен быть не меньше MAX_FILE_SIZE сервера
            client_max_body_size 10m;
            proxy_pass http://127.0.0.1:4003/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Настройки для исправления ERR_INCOMPLETE_CHUNKED_ENCODING
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
        }
    }
}
