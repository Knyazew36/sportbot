events {
    worker_connections 768;
}

http {
    ##
    # Basic Settings
    ##
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # SSL Settings
    ##

    ##
    # Logging Settings
    ##
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    ##
    # Gzip Settings
    ##
    gzip on;

    ##
    # Include additional config files
    ##

    ##
    # HTTPS Server Block
    ##

    ##Основной
    server {
        server_name 5278831-ad07030.twc1.net;

        # API проксирование
        location /api/ {
            client_max_body_size 10m;
            proxy_pass http://127.0.0.1:4000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Настройки для исправления ERR_INCOMPLETE_CHUNKED_ENCODING
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }


        # Реальные ассеты — без SPA-фолбэка на index.html, иначе битые/старые
        # пути отдают text/html вместо text/css|js (MIME error у клиента).
        # Имена файлов хешированы (vite), контент неизменен — кэшируем надолго.
        location /assets/ {
            root /var/www/warehouse-turbo/apps/frontend/dist;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Билд фронта всегда собирается с base=/max-app/ (см. vite.config.ts),
        # поэтому хешированные ассеты ссылаются сюда же, под /max-app/assets/ —
        # им, как и /assets/ выше, нужен долгий кэш, а не no-cache соседнего html.
        location /max-app/assets/ {
          alias /var/www/warehouse-turbo/apps/frontend/dist/assets/;
          try_files $uri =404;
          add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /max-app/ {
          alias /var/www/warehouse-turbo/apps/frontend/dist/;
          try_files $uri $uri/ /max-app/index.html;
          add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # index.html ссылается на хешированные ассеты конкретного билда — если
        # браузер закэширует его сам (эвристика по Last-Modified), после деплоя
        # он продолжит запрашивать уже удалённые старые ассеты (404, без стилей)
        # и не переспросит сервер, пока кэш не протухнет. Запрещаем кэш HTML явно.
        location / {
          root /var/www/warehouse-turbo/apps/frontend/dist;
          index index.html;
          try_files $uri $uri/ /index.html;
          add_header Cache-Control "no-cache, no-store, must-revalidate";
        }


        listen 443 ssl; # managed by Certbot
        ssl_certificate /etc/letsencrypt/live/5278831-ad07030.twc1.net/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/5278831-ad07030.twc1.net/privkey.pem; # managed by Certbot
        include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    }

  ##Тестовый
    server {
         listen 443 ssl;
        server_name test.5278831-ad07030.twc1.net;
        ssl_certificate /etc/letsencrypt/live/test.5278831-ad07030.twc1.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/test.5278831-ad07030.twc1.net/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
        # API проксирование
        location /api/ {
            client_max_body_size 10m;
            proxy_pass http://127.0.0.1:4001/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Настройки для исправления ERR_INCOMPLETE_CHUNKED_ENCODING
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # Бот Max открывает /max-app — вебвью нативного приложения плохо
        # переносит редирект на другой путь, поэтому отдаём фронт прямо
        # по этому пути (alias), без ухода на /.
        location = /max-app {
          return 301 /max-app/;
        }

        location /max-app/assets/ {
          alias /var/www/test-warehouse/warehouse-turbo/apps/frontend/dist/assets/;
          try_files $uri =404;
          add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /max-app/ {
          alias /var/www/test-warehouse/warehouse-turbo/apps/frontend/dist/;
          try_files $uri $uri/ /max-app/index.html;
          add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Реальные ассеты — без SPA-фолбэка на index.html, иначе битые/старые
        # пути отдают text/html вместо text/css|js (MIME error у клиента).
        location /assets/ {
            root /var/www/test-warehouse/warehouse-turbo/apps/frontend/dist;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            root /var/www/test-warehouse/warehouse-turbo/apps/frontend/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

  ##Второй прод — 24skladcontrol.ru
  ## app./api. — DNS + серты (certbot certonly) готовы, оба живые.
  server {
        listen 443 ssl; # managed by Certbot
        server_name app.24skladcontrol.ru;
        ssl_certificate /etc/letsencrypt/live/app.24skladcontrol.ru/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/app.24skladcontrol.ru/privkey.pem; # managed by Certbot
        include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

        # Реальные ассеты — без SPA-фолбэка на index.html, иначе битые/старые
        # пути отдают text/html вместо text/css|js (MIME error у клиента).
        location /assets/ {
            root /var/www/24skladcontrol/warehouse-turbo/apps/frontend/dist;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Билд фронта всегда собирается с base=/max-app/ (см. vite.config.ts).
        location /max-app/assets/ {
          alias /var/www/24skladcontrol/warehouse-turbo/apps/frontend/dist/assets/;
          try_files $uri =404;
          add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /max-app/ {
          alias /var/www/24skladcontrol/warehouse-turbo/apps/frontend/dist/;
          try_files $uri $uri/ /max-app/index.html;
          add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location / {
            root /var/www/24skladcontrol/warehouse-turbo/apps/frontend/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # api. — DNS и серт готовы, certbot --nginx до этого блока не смог
    # (текстовый мэтчер зацепился не за тот блок), серт выписан certonly-эквивалентом
    # вручную привязан ниже.
    server {
        listen 443 ssl; # managed by Certbot
        server_name api.24skladcontrol.ru;
        ssl_certificate /etc/letsencrypt/live/api.24skladcontrol.ru/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/api.24skladcontrol.ru/privkey.pem; # managed by Certbot
        include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

        location / {
            client_max_body_size 10m;
            proxy_pass http://127.0.0.1:4002/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Настройки для исправления ERR_INCOMPLETE_CHUNKED_ENCODING
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }
    }

    # Лендинг (apps/landing, статика — Astro build с CI_ENV=dev, см. apps/landing/deploy.sh).
    # Серт куплен на 24skladcontrol.ru + www.24skladcontrol.ru (GlobalSign AlphaSSL,
    # залит вручную, не через certbot) — app. этим сертом НЕ покрыт.
    server {
        listen 443 ssl;
        server_name 24skladcontrol.ru;
        ssl_certificate /etc/nginx/ssl/24skladcontrol/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/24skladcontrol/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        root /var/www/24skladcontrol/warehouse-turbo/apps/landing/dist;
        index index.html;

        # Без SPA-фолбэка на index.html — страницы лендинга статические
        # (dist/main/, dist/pricing/ и т.д.), битый путь должен отдавать 404,
        # а не чужую страницу (см. аналогичный комментарий у /assets/ выше).
        location / {
            try_files $uri $uri/ =404;
        }

        # styles/index.css — имя фиксированное (astro.config.mjs специально
        # убирает хеш из ссылки), в отличие от scripts/script.js там нет
        # cache-busting query. Без no-cache браузер после деплоя тихо
        # покажет старые стили, без ошибки в консоли.
        location /styles/ {
            try_files $uri =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    ##Проект scena — фронт
    server {
        listen 443 ssl; # managed by Certbot
        server_name scena.24skladcontrol.ru;
        ssl_certificate /etc/letsencrypt/live/scena.24skladcontrol.ru/fullchain.pem; # managed by Certbot
