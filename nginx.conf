    ##Проект scena — бек
    server {
        listen 443 ssl; # managed by Certbot
        server_name api-scena.24skladcontrol.ru;
        ssl_certificate /etc/letsencrypt/live/api-scena.24skladcontrol.ru/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/api-scena.24skladcontrol.ru/privkey.pem; # managed by Certbot
        include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

        location / {
            client_max_body_size 10m;
            proxy_pass http://127.0.0.1:4003/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }
    }

    # www — редирект на канонический non-www (SEO: убираем дубль контента).
    server {
        listen 443 ssl;
        server_name www.24skladcontrol.ru;
        ssl_certificate /etc/nginx/ssl/24skladcontrol/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/24skladcontrol/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        return 301 https://24skladcontrol.ru$request_uri;
    }

    ##
    # HTTP Server Block (Redirect to HTTPS)
    ##
    server {
        listen 80;
        server_name 5278831-ad07030.twc1.net test.5278831-ad07030.twc1.net 24skladcontrol.ru www.24skladcontrol.ru app.24skladcontrol.ru api.24skladcontrol.ru scena.24skladcontrol.ru api-scena.24skladcontrol.ru;
        return 301 https://$host$request_uri;
    }
}
