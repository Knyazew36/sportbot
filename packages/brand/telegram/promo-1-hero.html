<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .wrap {
        position: absolute;
        inset: 170px 90px 150px;
        display: flex;
        flex-direction: column;
      }
      .tile {
        width: 240px;
        height: 240px;
        border-width: 6px;
        box-shadow: 18px 18px 0 var(--ink);
      }
      .name {
        margin-top: 90px;
        font-size: 30px;
        letter-spacing: 0.16em;
      }
      h1 {
        margin-top: 34px;
        font-size: 158px;
        line-height: 0.9;
        white-space: nowrap;
      }
      .lead {
        margin-top: 36px;
        font-size: 60px;
      }
      .ticket {
        margin-top: 70px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border: 3px solid var(--ink);
        background: var(--sheet);
      }
      .ticket > div {
        padding: 26px 30px;
        border-left: 3px solid var(--ink);
      }
      .ticket > div:first-child {
        border-left: 0;
      }
      .ticket b {
        display: block;
        font-family: 'Oswald', sans-serif;
        font-size: 96px;
        line-height: 1;
      }
      .ticket span {
        display: block;
        margin-top: 14px;
        font-size: 20px;
      }
      .list {
        margin-top: auto;
        border-top: 3px solid var(--ink);
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 36px;
        padding: 30px 0;
        border-bottom: 3px solid var(--ink);
      }
      .row b {
        font-family: 'Oswald', sans-serif;
        font-size: 44px;
        width: 70px;
      }
      .row span {
        font-size: 42px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="canvas promo">
      <div class="wrap">
        <div class="tile">
          <svg viewBox="0 0 350 350"><path d="M126 98L256 175L126 252Z" fill="#0a0a0a" /></svg>
        </div>
        <p class="eyebrow name">Спортбот · Telegram</p>
        <h1 class="poster">Тренировка<br /><span class="blue">не теряется</span></h1>
        <p class="lead">напарник, который<br />помнит план за тебя</p>
        <div class="ticket">
          <div><b>5</b><span class="eyebrow">упражнений</span></div>
          <div><b>16</b><span class="eyebrow">подходов</span></div>
          <div><b>14</b><span class="eyebrow">серия</span></div>
        </div>
        <div class="list">
          <div class="row"><b>01</b><span>Утром — что сегодня по плану</span></div>
          <div class="row"><b>02</b><span>В зале — подходы, веса и отдых</span></div>
          <div class="row"><b>03</b><span>Вечером — отметка и серия</span></div>
        </div>
      </div>
    </div>
  </body>
</html>
